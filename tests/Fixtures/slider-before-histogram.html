    x-data="typeof dsSlider === &#039;function&#039; ? dsSlider({&quot;minGap&quot;:0,&quot;format&quot;:{&quot;locale&quot;:&quot;en&quot;,&quot;minimumFractionDigits&quot;:0,&quot;maximumFractionDigits&quot;:2,&quot;useGrouping&quot;:true,&quot;prefix&quot;:&quot;&quot;,&quot;suffix&quot;:&quot;&quot;,&quot;compact&quot;:false}}) : (() =&gt; { throw new Error(&quot;dsSlider is not registered: add &lt;x-ds::scripts /&gt; above the Alpine script, or call Alpine.plugin(bladeUi) where Alpine is bundled.&quot;) })()"
    x-modelable="dsValue"
    
    
    data-ds-slider="single"
        class="[--ds-slider-inset:2px] mt-4"
>
            <div class="flex items-baseline justify-between gap-3">
                            
                <label id="vol-label" for="vol" class="block text-body font-medium text-fg">Volume</label>
                                </div>
    
    <div
        class="relative h-11 sm:h-9 mt-1.5"
        data-ds-slider-body
        style="--ds-slider-low: 0; --ds-slider-high: 0.4"
    >
        <div class="pointer-events-none absolute inset-x-3 top-1/2 -translate-y-1/2 rounded-full bg-fg/10 h-1.5" aria-hidden="true" data-ds-slider-track>
            <div class="absolute inset-y-0 start-[calc(var(--ds-slider-low)*100%)] end-[calc((1-var(--ds-slider-high))*100%)] rounded-full bg-surface-inverse" data-ds-slider-fill></div>
                    </div>

                                <input type="range" id="vol" name="volume" min="0" max="100" step="1" value="40" aria-valuetext="40" class="absolute inset-x-0 top-1/2 h-6 w-full -translate-y-1/2 cursor-pointer disabled:cursor-not-allowed" data-ds-slider-input="high" />
                        </div>

    
    </div>
